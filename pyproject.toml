[project]
name = "beyond-the-chatbot"
version = "0.1.0"
description = "Beyond the Chatbot — A Tour of the AI Universe. Talk + CLI scaffold."
authors = [{ name = "John Gardner (Sinjhin)", email = "john@ardea.io" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "rich>=13.7",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "prompt-toolkit>=3.0.50",
]

[project.scripts]
tour = "tour.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tour"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
